[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dictmerge"
version = "0.1"
dependencies = [
    "orjson",
    "pytest",
]
requires-python = ">=3.12"
authors = [
    { name = "bobbycyl", email = "bobbycyl@126.com" },
]
description = "dict override"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/bobbycyl/dictmerge.git"
"Bug Tracker" = "https://github.com/bobbycyl/dictmerge/issues"

[tool.ruff]
line-length = 255

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
]
ignore = [
    "E501"
]
